<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P_O_M_Framework Process Flow</title>
  <desc id="desc">High-level test execution flow from trigger through teardown and report generation.</desc>
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Arial, sans-serif; fill: #334155; }
      .node { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; ry: 10; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .text { font: 13px Arial, sans-serif; fill: #111827; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowHead); }
      .label { font: 12px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <text x="40" y="40" class="title">P_O_M_Framework - Clickable SVG Process Flow</text>
  <text x="40" y="64" class="subtitle">Use this file directly in browser for a visual overview of test execution lifecycle.</text>

  <rect x="60" y="100" width="180" height="60" class="node"/>
  <text x="94" y="136" class="text">Start Test Run</text>

  <rect x="300" y="95" width="220" height="70" class="decision" transform="rotate(0 410 130)"/>
  <text x="335" y="124" class="text">Trigger Type:</text>
  <text x="342" y="144" class="text">Maven or TestNG XML</text>

  <rect x="600" y="100" width="220" height="60" class="node"/>
  <text x="624" y="136" class="text">Load Suite Definition</text>

  <rect x="900" y="100" width="220" height="60" class="node"/>
  <text x="922" y="136" class="text">BaseClass @BeforeSuite</text>

  <rect x="900" y="200" width="220" height="60" class="node"/>
  <text x="923" y="236" class="text">Driver Setup + Waits</text>

  <rect x="600" y="220" width="220" height="60" class="node"/>
  <text x="632" y="256" class="text">Run Test Methods</text>

  <rect x="300" y="220" width="220" height="60" class="node"/>
  <text x="335" y="256" class="text">Invoke Page Objects</text>

  <rect x="60" y="220" width="180" height="60" class="node"/>
  <text x="93" y="256" class="text">Assertions</text>

  <rect x="300" y="340" width="220" height="70" class="decision"/>
  <text x="330" y="369" class="text">Listener Enabled?</text>
  <text x="332" y="389" class="text">Retry / Screenshot</text>

  <rect x="600" y="350" width="220" height="60" class="node"/>
  <text x="626" y="386" class="text">Generate Reports</text>

  <rect x="900" y="350" width="220" height="60" class="node"/>
  <text x="926" y="386" class="text">@AfterSuite Teardown</text>

  <rect x="900" y="460" width="220" height="60" class="node"/>
  <text x="970" y="496" class="text">Driver Quit</text>

  <rect x="600" y="460" width="220" height="60" class="node"/>
  <text x="652" y="496" class="text">test-output/</text>

  <path d="M240 130 L300 130" class="arrow"/>
  <path d="M520 130 L600 130" class="arrow"/>
  <path d="M820 130 L900 130" class="arrow"/>
  <path d="M1010 160 L1010 200" class="arrow"/>
  <path d="M900 230 L820 250" class="arrow"/>
  <path d="M600 250 L520 250" class="arrow"/>
  <path d="M300 250 L240 250" class="arrow"/>
  <path d="M150 280 L150 375 L300 375" class="arrow"/>
  <path d="M520 375 L600 380" class="arrow"/>
  <path d="M820 380 L900 380" class="arrow"/>
  <path d="M1010 410 L1010 460" class="arrow"/>
  <path d="M900 490 L820 490" class="arrow"/>

  <text x="540" y="366" class="label">yes/no</text>
  <text x="45" y="720" class="subtitle">Open this file directly: PROCESS_FLOW.svg</text>
</svg>
